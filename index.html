<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X2G6TCB5E4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-X2G6TCB5E4');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon ──────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />

    <!-- ── Google Fonts ─────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ── Primary SEO ──────────────────────────────────────────────────
         Per-page title, description, canonical, Open Graph and Twitter
         tags are owned by the SEO component (react-helmet-async) and are
         baked in at prerender time. Only site-wide static tags live here
         so the served HTML has exactly one of each. -->
    <title>Controva LLC — Custom VoIP & AI Voice Infrastructure</title>
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Controva LLC" />
    <meta property="og:site_name" content="Controva LLC" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@controvallc" />

    <!-- ── Sitemap & RSS references ─────────────────────────── -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="alternate" type="application/rss+xml" title="Controva LLC Blog RSS Feed" href="/rss.xml" />


    <!-- ── JSON-LD: WebSite (enables Google Sitelinks Searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.controvallc.com/#website",
          "name": "Controva LLC",
          "url": "https://www.controvallc.com"
        },
        {
          "@type": "Organization",
          "@id": "https://www.controvallc.com/#organization",
          "name": "Controva LLC",
          "url": "https://www.controvallc.com",
          "logo": "https://www.controvallc.com/favicon.svg",
          "sameAs": [
            "https://linkedin.com/company/controvallc",
            "https://x.com/controvallc",
            "https://instagram.com/controvallc",
            "https://github.com/controva-netizen"
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100svh;
          background-color: #FAFAFB;
        }
        .spinner {
          width: 40px;
          height: 40px;
          border: 3px solid rgba(30, 58, 138, 0.1);
          border-radius: 50%;
          border-top-color: #1E3A8A;
          animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @media (prefers-color-scheme: dark) {
          .initial-loader { background-color: #0D1117; }
          .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #FFFFFF;
          }
        }
      </style>
      <div class="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
