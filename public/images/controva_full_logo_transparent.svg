<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90">
  <defs>
    <linearGradient id="brand-grad-tr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="icon-grad-tr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow-tr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon square -->
  <rect x="15" y="13" width="64" height="64" rx="16" fill="#0b1120" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
  <text x="47" y="57" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="-1" text-anchor="middle" fill="url(#icon-grad-tr)" filter="url(#glow-tr)">CL</text>

  <!-- Typography "Controva" -->
  <text x="96" y="58" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-1" fill="#FFFFFF">Controva</text>

  <!-- "LLC" with gradient -->
  <text x="310" y="58" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="44" font-weight="400" letter-spacing="-0.5" fill="url(#brand-grad-tr)">LLC</text>

  <!-- Flourish underline under LLC -->
  <path d="M312 68 Q346 74 380 68" stroke="url(#brand-grad-tr)" stroke-width="2.5" fill="none" stroke-linecap="round" />
</svg>
